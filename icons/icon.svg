<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Magnifying Glass Handle (Bottom Right) -->
  <path d="M84 84 L104 104" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>

  <!-- Clock / Loupe Outer Ring -->
  <circle cx="56" cy="56" r="34" fill="#064e3b" stroke="url(#rim)" stroke-width="9"/>

  <!-- Clock Cardinal Ticks -->
  <line x1="56" y1="29" x2="56" y2="34" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="83" y1="56" x2="78" y2="56" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="56" y1="83" x2="56" y2="78" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="29" y1="56" x2="34" y2="56" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Clock Hands (Pointing to 10:10 / Rewind Truth) -->
  <path d="M56 56 L56 38" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M56 56 L42 48" stroke="#fde68a" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="56" cy="56" r="5" fill="#fde68a"/>

  <!-- Verification Spark / Truth Badge (Top Right) -->
  <circle cx="94" cy="32" r="13" fill="#fbbf24" stroke="#065f46" stroke-width="3"/>
  <path d="M88.5 32.5 L92.5 36.5 L100 28.5" fill="none" stroke="#064e3b" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
